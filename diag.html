<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>BATTERY Diag</title>
<style>
:root{--bg:#0d1117;--fg:#e6edf3;--gold:#f0b832;--line:#30363d;--faint:#8b949e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;font-size:14px;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);min-height:100vh;min-height:100dvh}
.wrap{max-width:400px;margin:0 auto;padding:16px}
h1{color:var(--gold);font-size:18px;letter-spacing:2px;margin-bottom:12px;font-family:'SF Mono',monospace}
table{width:100%;border-collapse:collapse;margin-bottom:20px}
th{text-align:left;color:var(--faint);font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);font-family:'SF Mono',monospace;font-size:13px}
td:first-child{color:var(--faint);width:45%}
td:last-child{color:var(--fg);font-weight:600}
.section{margin-bottom:16px}
.section-title{color:var(--gold);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--gold)}
.box{background:#161b22;border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px;overflow-x:auto}
.ua{font-size:10px;word-break:break-all;color:var(--faint);line-height:1.5}
.swatch{display:inline-block;width:100%;height:40px;border-radius:6px;border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.grid .box{margin-bottom:0;text-align:center}
.grid .box .num{font-size:28px;font-weight:700;font-family:'SF Mono',monospace;color:var(--gold)}
.grid .box .lbl{font-size:9px;letter-spacing:1px;color:var(--faint);text-transform:uppercase;margin-top:4px}
.safe{background:var(--gold);color:var(--bg);padding:2px 8px;border-radius:4px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
<h1>BATTERY DIAG</h1>

<div class="section">
<div class="section-title">Viewport</div>
<div class="grid">
<div class="box"><div class="num" id="vw">—</div><div class="lbl">CSS Width</div></div>
<div class="box"><div class="num" id="vh">—</div><div class="lbl">CSS Height</div></div>
<div class="box"><div class="num" id="dw">—</div><div class="lbl">dvw</div></div>
<div class="box"><div class="num" id="dh">—</div><div class="lbl">dvh</div></div>
</div>
</div>

<div class="section">
<div class="section-title">Screen</div>
<table>
<tr><td>screen.width</td><td id="sw">—</td></tr>
<tr><td>screen.height</td><td id="sh">—</td></tr>
<tr><td>devicePixelRatio</td><td id="dpr">—</td></tr>
<tr><td>Physical px</td><td id="phys">—</td></tr>
<tr><td>orientation</td><td id="orient">—</td></tr>
</table>
</div>

<div class="section">
<div class="section-title">Safe Area Insets</div>
<div class="box">
<table>
<tr><td>top</td><td id="sa-top">—</td></tr>
<tr><td>right</td><td id="sa-right">—</td></tr>
<tr><td>bottom</td><td id="sa-bottom">—</td></tr>
<tr><td>left</td><td id="sa-left">—</td></tr>
</table>
</div>
</div>

<div class="section">
<div class="section-title">PWA Mode</div>
<table>
<tr><td>display-mode</td><td id="dm">—</td></tr>
<tr><td>standalone</td><td id="sa">—</td></tr>
<tr><td>SW controller</td><td id="swc">—</td></tr>
</table>
</div>

<div class="section">
<div class="section-title">User Agent</div>
<div class="box"><div class="ua" id="ua">—</div></div>
</div>

<div class="section">
<div class="section-title">iframe test</div>
<div class="box" id="iframe-box" style="height:60px;position:relative;overflow:hidden">
<iframe id="test-frame" src="arm.html" style="position:absolute;top:0;left:0;width:100%;height:300px;border:0;pointer-events:none;opacity:0.3"></iframe>
<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1;font-size:11px;letter-spacing:1px" id="iframe-status">checking...</div>
</div>
</div>
</div>

<script>
function measure(){
  document.getElementById('vw').textContent = window.innerWidth;
  document.getElementById('vh').textContent = window.innerHeight;

  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;width:100dvw;height:100dvh;visibility:hidden;pointer-events:none';
  document.body.appendChild(d);
  document.getElementById('dw').textContent = d.offsetWidth;
  document.getElementById('dh').textContent = d.offsetHeight;
  document.body.removeChild(d);

  document.getElementById('sw').textContent = screen.width;
  document.getElementById('sh').textContent = screen.height;
  document.getElementById('dpr').textContent = devicePixelRatio;
  document.getElementById('phys').textContent = (screen.width * devicePixelRatio) + ' × ' + (screen.height * devicePixelRatio);
  document.getElementById('orient').textContent = screen.orientation ? screen.orientation.type : (window.orientation || 'n/a');

  var cs = getComputedStyle(document.documentElement);
  document.getElementById('sa-top').textContent = cs.getPropertyValue('padding-top') || getComputedStyle(document.body).paddingTop || '0';
  // Read env() via a temp element
  ['top','right','bottom','left'].forEach(function(side){
    var el = document.createElement('div');
    el.style.cssText = 'position:fixed;height:0;width:0;padding-'+side+':env(safe-area-inset-'+side+',0px)';
    document.body.appendChild(el);
    var val = getComputedStyle(el)['padding'+side.charAt(0).toUpperCase()+side.slice(1)];
    document.getElementById('sa-'+side).textContent = val;
    document.body.removeChild(el);
  });

  document.getElementById('dm').textContent = window.matchMedia('(display-mode: standalone)').matches ? 'standalone' : 'browser';
  document.getElementById('sa').textContent = navigator.standalone === true ? 'YES' : navigator.standalone === false ? 'no' : 'n/a';
  document.getElementById('swc').textContent = navigator.serviceWorker && navigator.serviceWorker.controller ? 'active' : 'none';
  document.getElementById('ua').textContent = navigator.userAgent;

  // iframe test
  var ifr = document.getElementById('test-frame');
  var status = document.getElementById('iframe-status');
  setTimeout(function(){
    try {
      var doc = ifr.contentDocument || ifr.contentWindow.document;
      var len = doc.body ? doc.body.innerHTML.length : 0;
      status.textContent = len > 1000 ? 'LOADED (' + Math.round(len/1024) + 'KB)' : 'EMPTY (' + len + ' bytes)';
      status.style.color = len > 1000 ? '#3fb950' : '#f85149';
    } catch(e) {
      status.textContent = 'BLOCKED: ' + e.message;
      status.style.color = '#f85149';
    }
  }, 3000);
}
measure();
window.addEventListener('resize', measure);
</script>
</body>
</html>
